name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docsAndStyle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
      - run: python3 scripts/check_documentation.py
      - run: uvx --from 'ruff==0.16.4' ruff check .
      - run: uvx --from 'ruff==0.16.4' ruff format --check .
      - name: SDK-backed gate status
        run: |
          echo 'NOT_CONFIGURED: private SDK authorization is required for locked type/build checks'
