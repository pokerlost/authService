replicaCount: 1

image:
  pullPolicy: IfNotPresent

oauth2:
  issuer: urn:pokerlost:authService
  accessTokenTtlSeconds: 600

jwtSigningKey:
  enabled: true
  secretName: authservice-local-jwt-signing-key
  secretKey: private.pem
  mountPath: /var/run/secrets/pokerlost/authservice/private.pem
  keyId: authservice-rs256-local-1

environment:
  AUTHSERVICE_APPLICATION__ENVIRONMENT: development
  AUTHSERVICE_APPLICATION__VERSION: "0.1.0"
  AUTHSERVICE_LOGFIRE__ENABLED: "true"
  AUTHSERVICE_LOGFIRE__SEND_TO_LOGFIRE: "false"
  AUTHSERVICE_LOGFIRE__CONSOLE: "true"
  AUTHSERVICE_LOGFIRE__MINIMUM_LEVEL: info
  AUTHSERVICE_BUSINESS_OPERATION_FINGERPRINT__KEY_VERSION: "1"

secretEnvironment:
  AUTHSERVICE_BUSINESS_OPERATION_FINGERPRINT__SECRET:
    enabled: true
    name: authservice-local-runtime
    key: business-operation-fingerprint-secret
  AUTHSERVICE_LOGFIRE__TOKEN:
    enabled: false
  AUTHSERVICE_DATABASE__URL:
    enabled: true
    name: authservice-local-runtime
    key: database-url

gunicorn:
  workers: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi
