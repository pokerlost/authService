replicaCount: 1

image:
  pullPolicy: IfNotPresent

application:
  environment: development

database:
  existingSecret: authservice-local-runtime
  poolSize: 5
  maxOverflow: 5

logfire:
  sendToLogfire: false
  consoleEnabled: true
  existingSecret: ""

gunicorn:
  workers: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi
