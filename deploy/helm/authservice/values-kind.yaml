replicaCount: 1

image:
  pullPolicy: IfNotPresent

application:
  environment: development
  version: "0.1.0"

database:
  existingSecret: authservice-local-runtime
  poolSize: 5
  maxOverflow: 5

refreshToken:
  existingSecret: authservice-local-runtime

serviceAuth:
  existingSecret: authservice-local-runtime

logfire:
  enabled: true
  sendToLogfire: false
  console: true
  minimumLevel: info
  existingSecret: ""

gunicorn:
  workers: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi
