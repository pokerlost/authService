rootOperation: getRoot
openapiOperation: getOpenApi

replicaCount: 2

image:
  repository: pokerlost/authservice
  tag: "0.1.0"
  pullPolicy: IfNotPresent

http:
  port: 8000

token:
  issuer: urn:pokerlost:authService
  accessTokenTtlSeconds: 600

jwtSigningKey:
  enabled: true
  secretName: authservice-jwt-signing-key
  secretKey: private.pem
  mountPath: /var/run/secrets/pokerlost/authservice/private.pem
  keyId: authservice-rs256-1

environment:
  AUTHSERVICE_APPLICATION__ENVIRONMENT: production
  AUTHSERVICE_APPLICATION__VERSION: "0.1.0"
  AUTHSERVICE_HTTP__HOST: 0.0.0.0
  AUTHSERVICE_HTTP__PORT: "8000"
  AUTHSERVICE_LOGFIRE__ENABLED: "true"
  AUTHSERVICE_LOGFIRE__SEND_TO_LOGFIRE: "true"
  AUTHSERVICE_LOGFIRE__CONSOLE: "true"
  AUTHSERVICE_LOGFIRE__MINIMUM_LEVEL: info
  AUTHSERVICE_DATABASE__POOL_SIZE: "10"
  AUTHSERVICE_DATABASE__MAX_OVERFLOW: "10"
  AUTHSERVICE_DATABASE__POOL_TIMEOUT_SECONDS: "10"
  AUTHSERVICE_DATABASE__COMMAND_TIMEOUT_SECONDS: "30"

secretEnvironment:
  AUTHSERVICE_LOGFIRE__TOKEN:
    enabled: true
    name: authservice-logfire
    key: token
  AUTHSERVICE_DATABASE__URL:
    enabled: true
    name: authservice-runtime
    key: database-url

gunicorn:
  workers: 2
  timeout: 30
  gracefulTimeout: 30
  keepalive: 5
  forwardedAllowIps: "127.0.0.1"

service:
  # Keep this ClusterIP behind mandatory deployment HTTPS/TLS termination.
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 40
