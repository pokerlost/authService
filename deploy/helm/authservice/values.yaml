replicaCount: 2

image:
  repository: pokerlost/authservice
  tag: "0.1.0"
  pullPolicy: IfNotPresent

http:
  port: 8000

environment:
  AUTHSERVICE_LOGLEVEL: INFO

secretEnvironment:
  DATABASE_URL:
    enabled: true
    name: authservice-runtime
    key: database-url

service:
  # Keep this ClusterIP behind mandatory deployment HTTPS/TLS termination.
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 40
