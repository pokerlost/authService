replicaCount: 2

image:
  repository: pokerlost/authservice
  tag: "0.1.0"
  pullPolicy: IfNotPresent

application:
  environment: production

http:
  port: 8000
  openapiEnabled: true

database:
  existingSecret: authservice-runtime
  urlKey: database-url
  poolSize: 10
  maxOverflow: 10
  poolTimeoutSeconds: 10
  commandTimeoutSeconds: 30

password:
  timeCost: 3
  memoryCostKib: 65536
  parallelism: 4
  hashLength: 32
  saltLength: 16

jwt:
  issuer: authService
  humanAudience: authService
  accessTokenTtlSeconds: 600
  clockSkewSeconds: 30
  activeKid: key-20260822-a
  activePrivateKeyPath: /run/secrets/pokerlost/auth/active-private.pem
  retainedPublicKeyDirectory: /run/secrets/pokerlost/auth/public
  jwksCacheTtlSeconds: 60
  existingSigningSecret: authservice-signing
  signingPrivateKeySecretItem: active-private.pem
  publicKeySecretItems:
    - key-20260822-a.pem

logfire:
  sendToLogfire: true
  consoleEnabled: true
  existingSecret: authservice-logfire
  tokenKey: token

gunicorn:
  workers: 2
  timeout: 30
  gracefulTimeout: 30
  keepalive: 5
  forwardedAllowIps: "127.0.0.1"

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 40
