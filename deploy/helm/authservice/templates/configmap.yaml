apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pokerlost.service.fullname" . }}
  labels:
    {{- include "pokerlost.service.labels" . | nindent 4 }}
data:
  AUTHSERVICE_ROOT_OPERATION: {{ required "rootOperation is required" .Values.rootOperation | quote }}
  AUTHSERVICE_OPENAPI_OPERATION: {{ required "openapiOperation is required" .Values.openapiOperation | quote }}
  AUTHSERVICE_TOKEN__ISSUER: {{ required "token.issuer is required" .Values.token.issuer | quote }}
  AUTHSERVICE_TOKEN__ACCESS_TOKEN_TTL_SECONDS: {{ required "token.accessTokenTtlSeconds is required" .Values.token.accessTokenTtlSeconds | quote }}
  AUTHSERVICE_JWT__PRIVATE_KEY_PATH: {{ required "jwtSigningKey.mountPath is required" .Values.jwtSigningKey.mountPath | quote }}
  AUTHSERVICE_JWT__KEY_ID: {{ required "jwtSigningKey.keyId is required" .Values.jwtSigningKey.keyId | quote }}
  {{- range $name, $value := .Values.environment }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
