apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authservice.fullname" . }}
  labels:
    {{- include "authservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "authservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authservice.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: authservice
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "authservice.fullname" . }}
          env:
            - name: AUTH_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            {{- if .Values.logfire.sendToLogfire }}
            - name: AUTH_LOGFIRE__TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "logfire.existingSecret is required" .Values.logfire.existingSecret }}
                  key: {{ .Values.logfire.tokenKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health.checkLiveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health.checkReadiness
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: signing-keys
              mountPath: /run/secrets/pokerlost/auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: signing-keys
          secret:
            secretName: {{ required "jwt.existingSigningSecret is required" .Values.jwt.existingSigningSecret }}
            items:
              - key: {{ required "jwt.signingPrivateKeySecretItem is required" .Values.jwt.signingPrivateKeySecretItem }}
                path: active-private.pem
              {{- range .Values.jwt.publicKeySecretItems }}
              - key: {{ . | quote }}
                path: public/{{ . }}
              {{- end }}
