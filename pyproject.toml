[project]
name = "pokerlost-authservice"
version = "0.1.0"
description = "Central identity, authentication, and coarse-grained authorization service for PokerLost"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.4,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.116.1,<1",
    "gunicorn>=23.0.0,<24",
    "logfire[fastapi,sqlalchemy]>=4.3.3,<5",
    "pydantic-settings>=2.10.1,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "typer>=0.16.0,<1",
    "uvicorn>=0.35.0,<1",
    "uvicorn-worker>=0.3.0,<1",
]

[project.scripts]
authservice = "cli.main:cli"

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2",
    "pre-commit>=4.2.0,<5",
    "ruff>=0.12.5,<1",
]

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "app/api",
    "app/application",
    "app/cli",
    "app/configuration",
    "app/domain",
    "app/observability",
    "app/persistence",
]

[tool.ruff]
target-version = "py312"
line-length = 99
exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = [
    "api",
    "application",
    "cli",
    "configuration",
    "domain",
    "observability",
    "persistence",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
mypy_path = "app"
files = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
