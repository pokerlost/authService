[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pokerlost-authservice"
version = "0.1.0"
description = "Pokerlost authorization service foundation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic-settings>=2.12,<3",
    "pypokerlost",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.17,<2",
]

[tool.uv.sources]
pypokerlost = { git = "ssh://git@github.com/pokerlost/pypokerlost.git", rev = "8652cc850ccef8a00538ba6ff0b545ff7f3d38af" }

[dependency-groups]
dev = ["mypy>=2.3,<2.4", "pre-commit==4.6.2", "ruff==0.16.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/authService"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "scripts", "migrations"]

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "D", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["D107", "D203", "D213", "D417"]

[tool.ruff.lint.isort]
known-first-party = ["authService"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/authService", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
